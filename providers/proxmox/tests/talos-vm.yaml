apiVersion: virtualenvironmentvm.proxmoxbpg.m.crossplane.io/v1alpha1
kind: EnvironmentVM
metadata:
  name: talos-test-01
  namespace: crossplane-system
spec:
  forProvider:
    name: talos-test-01
    nodeName: proxmox1
    vmId: 200

    description: |
      Talos test VM managed by Crossplane.
      Homelab only.

    started: true
    onBoot: true

    cpu:
      - cores: 2
        sockets: 1
        type: host

    memory:
      - dedicated: 4096
        floating: 0

    disk:
      - datastoreId: local-lvm
        interface: scsi0
        size: 20
        discard: "on"
        iothread: true

    cdrom:
      - enabled: true
        interface: ide2
        fileId: local:iso/talos-v1.12.0-amd64-ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515.iso

    networkDevice:
      - bridge: vmbr0
        model: virtio

    bootOrder:
      - ide2
      - scsi0

    scsiHardware: virtio-scsi-single

  providerConfigRef:
    name: default
    kind: ProviderConfig
